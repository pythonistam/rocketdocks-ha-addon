name: Lint
on:
  push:
  pull_request:
jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./rocketdocks
      - name: shellcheck
        run: shellcheck -x -e SC1008,SC2155 rocketdocks/rootfs/run.sh
